[project]
name = "loancopilot"
version = "0.1.0"
description = "SME Loan Copilot API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "argon2-cffi>=25.1.0",
    "arize-phoenix-otel>=0.17.3",
    "docling>=2.151.1",
    "fastapi>=0.165.0",
    "itsdangerous>=2.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the eval package (apps/api/eval)

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

# CPU-only torch on Linux (CI) instead of multi-GB CUDA wheels; macOS wheels are CPU already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
