name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-no-data.sh

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: loancopilot
          POSTGRES_PASSWORD: loancopilot
          POSTGRES_DB: loancopilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U loancopilot"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://loancopilot:loancopilot@localhost:5433/loancopilot
      EMBEDDINGS_BACKEND: fake
      RERANK: "off"
      SESSION_SECRET: ci-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm build
