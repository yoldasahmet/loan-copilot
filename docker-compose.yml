services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: loancopilot
      POSTGRES_PASSWORD: loancopilot
      POSTGRES_DB: loancopilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loancopilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:version-22.0.0
    profiles: ["tracing"]
    ports:
      - "6006:6006"

volumes:
  pgdata:
